# 1 NameNode + 2 DataNodes + YARN (ResourceManager + NodeManager). Untested here: verify image tag and python3 availability.
x-env: &env
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
  HDFS-SITE.XML_dfs.replication: "2"
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:9000
  YARN-SITE.XML_yarn.resourcemanager.hostname: resourcemanager
  YARN-SITE.XML_yarn.nodemanager.aux-services: mapreduce_shuffle
  MAPRED-SITE.XML_mapreduce.framework.name: yarn
  MAPRED-SITE.XML_yarn.app.mapreduce.am.env: HADOOP_MAPRED_HOME=/opt/hadoop
  MAPRED-SITE.XML_mapreduce.map.env: HADOOP_MAPRED_HOME=/opt/hadoop
  MAPRED-SITE.XML_mapreduce.reduce.env: HADOOP_MAPRED_HOME=/opt/hadoop
services:
  namenode:
    image: apache/hadoop:3
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment: {<<: *env, ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name}
    ports: ["9870:9870"]
    volumes: [".:/job"]
  datanode1: {image: "apache/hadoop:3", command: ["hdfs","datanode"], environment: *env}
  datanode2: {image: "apache/hadoop:3", command: ["hdfs","datanode"], environment: *env}
  resourcemanager: {image: "apache/hadoop:3", hostname: resourcemanager, command: ["yarn","resourcemanager"], environment: *env, ports: ["8088:8088"]}
  nodemanager: {image: "apache/hadoop:3", command: ["yarn","nodemanager"], environment: *env}
